[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiplicative-learning"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<2.6", "torchvision>=0.20,<0.21", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["erbench*", "multlearning*"]
