[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiplicative-learning"
version = "0.1.0"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<2.6", "torchvision>=0.20,<0.21", "numpy"]

[project.optional-dependencies]
test = ["pytest"]
paper = ["matplotlib>=3.10,<3.11", "pandas>=2.2,<3", "scipy>=1.14,<2"]

[tool.setuptools.packages.find]
include = ["erbench*", "multlearning*", "paper_tools*"]
